# Yazi configuration
[manager]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 6

[preview]
wrap = "no"
tab_size = 2
max_width = 1200
max_height = 1000

[opener]
edit = [
  { run = '${EDITOR:-micro} "$@"', block = true, desc = "Edit", for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = [ "edit", "open" ] },
  { url = "*.json", use = [ "edit", "open" ] },
  { url = "*.toml", use = [ "edit", "open" ] },
  { url = "*.yaml", use = [ "edit", "open" ] },
  { url = "*.yml", use = [ "edit", "open" ] },
  { url = "*.md", use = [ "edit", "open" ] },
]
