# Yazi configuration
[manager]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 6

[preview]
wrap = "no"
tab_size = 2
max_width = 1200
max_height = 1000

[opener]
edit = [
  { run = 'micro "$@"', block = true, desc = "Edit with micro", for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", for = "unix" },
]

[open]
rules = [
  { name = "*/", use = [ "edit", "open" ] },
  { mime = "text/*", use = [ "edit", "open" ] },
  { mime = "application/json", use = [ "edit", "open" ] },
  { mime = "application/x-yaml", use = [ "edit", "open" ] },
  { mime = "application/toml", use = [ "edit", "open" ] },
  { mime = "*", use = [ "open", "edit" ] },
]
