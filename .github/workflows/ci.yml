name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  lint:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate syntax (bash -n)
        run: |
          bash -n bin/dotfiles install.sh tests/*.sh .githooks/*

      - name: Run ShellCheck
        run: |
          shellcheck install.sh bin/dotfiles tests/*.sh .githooks/*

      - name: Scan for secrets
        run: |
          PATTERNS=(
            '-----BEGIN ([A-Z0-9]+[[:space:]])*PRIVATE KEY-----'
            '(AKIA|ASIA)[A-Z0-9]{16}'
            'github_pat_[A-Za-z0-9_]{20,}'
            'gh[pousr]_[A-Za-z0-9]{20,}'
            'sk-[A-Za-z0-9_-]{20,}'
            '(OPENAI_API_KEY|GEMINI_API_KEY|ANTHROPIC_API_KEY|GITHUB_TOKEN)[[:space:]]*=[[:space:]]*["'\'']?[A-Za-z0-9]'
          )
          GIT_PATTERNS=()
          for p in "${PATTERNS[@]}"; do
            GIT_PATTERNS+=(-e "$p")
          done
          if git grep --ignore-case -I -q -E "${GIT_PATTERNS[@]}" -- . 2>/dev/null; then
            echo "::error::Potential secret detected in repository!"
            git grep --ignore-case -I -l -E "${GIT_PATTERNS[@]}" -- .
            exit 1
          fi


  test:
    name: Bootstrap & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (stow, zsh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stow zsh

      - name: Validate Zsh configuration syntax (zsh -n)
        run: |
          for f in home/zsh/.zshrc home/zsh/.config/zsh/conf.d/*.zsh home/zsh/.config/zsh/init.d/*.zsh; do
            [[ -f "$f" ]] && zsh -n "$f"
          done

      - name: Run smoke tests
        run: |
          chmod +x tests/*.sh bin/dotfiles install.sh
          ./tests/smoke.sh
