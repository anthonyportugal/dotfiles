name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate syntax (bash -n)
        run: |
          # bash -n only parses its first operand; the rest become arguments.
          for file in bin/dotfiles install.sh lib/*.sh tests/*.sh .githooks/* layers/*/hooks/* layers/wm/*/hooks/* layers/wm/*/tests/*.sh layers/desktop/home/theme/.local/bin/dotfiles-theme layers/system/install.sh layers/system/*/setup.sh layers/system/ly/startup.sh layers/system/tests/*.sh; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        run: |
          shellcheck -x install.sh bin/dotfiles lib/*.sh tests/*.sh .githooks/* layers/*/hooks/* layers/wm/*/hooks/* layers/wm/*/tests/*.sh layers/desktop/home/theme/.local/bin/dotfiles-theme layers/system/install.sh layers/system/*/setup.sh layers/system/ly/startup.sh layers/system/tests/*.sh

      - name: Scan for secrets
        run: |
          PATTERNS=(
            '-----BEGIN ([A-Z0-9]+[[:space:]])*PRIVATE KEY-----'
            '(AKIA|ASIA)[A-Z0-9]{16}'
            'github_pat_[A-Za-z0-9_]{20,}'
            'gh[pousr]_[A-Za-z0-9]{20,}'
            'sk-[A-Za-z0-9_-]{20,}'
            '(OPENAI_API_KEY|GEMINI_API_KEY|ANTHROPIC_API_KEY|GITHUB_TOKEN)[[:space:]]*=[[:space:]]*["'\'']?[A-Za-z0-9]'
          )
          GIT_PATTERNS=()
          for p in "${PATTERNS[@]}"; do
            GIT_PATTERNS+=(-e "$p")
          done
          if git grep --ignore-case -I -q -E "${GIT_PATTERNS[@]}" -- . 2>/dev/null; then
            echo "::error::Potential secret detected in repository!"
            git grep --ignore-case -I -l -E "${GIT_PATTERNS[@]}" -- .
            exit 1
          fi


  test:
    name: Bootstrap & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (zsh, jq, shellcheck, luajit)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh jq shellcheck luajit

      # Same Stow as Arch: Ubuntu's older one refuses to unstow next to a foreign file.
      - name: Install GNU Stow 2.4.1
        run: |
          curl -fsSL -o /tmp/stow.tar.gz https://ftp.gnu.org/gnu/stow/stow-2.4.1.tar.gz
          echo "2a671e75fc207303bfe86a9a7223169c7669df0a8108ebdf1a7fe8cd2b88780b  /tmp/stow.tar.gz" | sha256sum -c -
          tar -xzf /tmp/stow.tar.gz -C /tmp
          cd /tmp/stow-2.4.1
          ./configure --prefix=/usr
          make
          sudo make install
          stow --version

      - name: Validate Zsh configuration syntax (zsh -n)
        run: |
          for f in layers/core/home/zsh/.zshrc layers/core/home/zsh/.config/zsh/conf.d/*.zsh layers/core/home/zsh/.config/zsh/init.d/*.zsh; do
            [[ -f "$f" ]] && zsh -n "$f"
          done

      - name: Run smoke tests
        run: |
          chmod +x tests/*.sh layers/wm/*/tests/*.sh layers/system/tests/*.sh bin/dotfiles install.sh
          ./tests/smoke.sh
