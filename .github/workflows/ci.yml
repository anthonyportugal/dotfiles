name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  lint:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate syntax (bash -n)
        run: |
          bash -n bin/dotfiles install.sh tests/*.sh

      - name: Run ShellCheck
        run: |
          shellcheck install.sh bin/dotfiles tests/bootstrap-smoke.sh tests/wizard-smoke.sh

  test:
    name: Bootstrap & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (stow)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stow

      - name: Run bootstrap smoke test
        run: |
          chmod +x tests/bootstrap-smoke.sh bin/dotfiles install.sh
          ./tests/bootstrap-smoke.sh
