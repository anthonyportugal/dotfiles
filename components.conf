# External components added with `dotfiles add <name>`. Parsed, never sourced.
#
# One entry per line, fields separated by whitespace:
#   name url ref [src=dst ...]
#   name  lowercase letters, digits and dashes
#   ref   the full 40-character commit SHA the component is pinned to
#   src   a path inside the component checkout (~/.local/share/dotfiles/<name>)
#   dst   a path inside the home that becomes a symlink to src
# Paths are relative and never contain '.' or '..' segments. Bumping ref and
# running `dotfiles update` (or `dotfiles sync`) moves every machine to it.

walls https://github.com/anthonyportugal/walls.git 8d137d13b13898b8e791b62d77ea875395351d87 wallpapers=.local/share/wallpapers bin/walls=.local/bin/walls
