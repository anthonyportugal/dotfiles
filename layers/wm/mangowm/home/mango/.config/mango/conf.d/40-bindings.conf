# Applications and session security.
bind=SUPER,Return,spawn,$HOME/.local/lib/mangowm/terminal
bind=SUPER,D,spawn,$HOME/.local/lib/mangowm/launcher
bindl=SUPER,L,spawn,$HOME/.local/lib/mangowm/lock
bind=SUPER,Escape,reload_config
bind=SUPER+SHIFT,Escape,quit

# Window lifecycle and layouts.
bind=SUPER,C,killclient
bind=SUPER,Space,togglefloating
bind=SUPER,F,togglefullscreen
bind=SUPER,T,switch_layout
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# Workspace tags (SUPER+1..9, SUPER+SHIFT+1..9) and monitor navigation bindings
# are dynamically managed in config.local.conf via the monitors helper.

# Pointer operations never assume an output name.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
