# Low-cost defaults that work on any output topology.
blur=0
blur_optimized=1
shadows=0
animations=1
gappih=5
gappiv=5
gappoh=8
gappov=8
borderpx=2
bordercolor=0x585b70ff
focuscolor=0xf5c2e7ff
urgentcolor=0xf38ba8ff
scratchpadcolor=0x89b4faff
globalcolor=0xcba6f7ff
smartgaps=1

# Opacity (100% solid windows, no transparency)
focused_opacity=1.0
unfocused_opacity=1.0

# Rounded corners
border_radius=8
no_radius_when_single=0

# Dwindle Layout (true bspwm-style binary split based on aspect ratio)
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=1
default_mfact=0.55
default_nmaster=1

# Tags default layout (dwindle by default on all tags)
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

# Window rules for applications and floating utilities
# Terminal principal: siempre tiled en tag 1
windowrule=tags:1,appid:foot

# Terminal flotante
windowrule=isfloating:1,width:850,height:520,appid:floating-terminal

# Explorador de archivos (Thunar)
windowrule=isfloating:1,width:900,height:600,appid:thunar
windowrule=isfloating:1,width:900,height:600,appid:Thunar

# Reproductor multimedia (mpv)
windowrule=isfloating:1,appid:mpv

# Capturador y anotador (Satty)
windowrule=isfloating:1,appid:com.gabm.satty
windowrule=isfloating:1,appid:org.satty.satty
windowrule=isfloating:1,appid:satty

# Control de volumen
windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,appid:org.pulseaudio.pavucontrol

# Gestor Bluetooth
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:overskride

# Ajustes de red
windowrule=isfloating:1,appid:nm-connection-editor

# Configurador de pantallas
windowrule=isfloating:1,appid:wdisplays

# Selector de tema GTK
windowrule=isfloating:1,appid:nwg-look

# Visores de imágenes
windowrule=isfloating:1,appid:viewnior
windowrule=isfloating:1,appid:Viewnior
windowrule=isfloating:1,appid:feh
windowrule=isfloating:1,appid:imv
windowrule=isfloating:1,appid:swayimg
windowrule=isfloating:1,appid:org.gnome.Loupe
windowrule=isfloating:1,appid:eog
windowrule=isfloating:1,appid:qView
windowrule=isfloating:1,appid:qview

# Visualizador de PDF (Zathura)
windowrule=isfloating:1,appid:org.pwmt.zathura
windowrule=isfloating:1,appid:zathura
