# Desktop utilities. This file exists only in the desktop profile.
bind=NONE,Print,spawn,$HOME/.local/lib/mangowm/screenshot fullscreen
bind=SUPER,S,spawn,$HOME/.local/lib/mangowm/screenshot fullscreen
bind=SUPER+SHIFT,S,spawn,$HOME/.local/lib/mangowm/screenshot annotate
bind=SUPER,E,spawn,thunar
bind=SUPER,B,spawn,$HOME/.local/lib/mangowm/browser
bind=SUPER+SHIFT,Return,spawn,$HOME/.local/lib/mangowm/terminal --app-id=floating-terminal
bind=SUPER,X,spawn,$HOME/.local/lib/mangowm/power-menu
bind=SUPER+SHIFT,P,spawn,$HOME/.local/lib/mangowm/power-profile select
bind=SUPER,N,spawn,$HOME/.local/lib/mangowm/night-light toggle
bind=SUPER,W,spawn,$HOME/.local/lib/mangowm/wallpaper select
bind=SUPER+SHIFT,W,spawn,$HOME/.local/lib/mangowm/wifi select
bind=SUPER+SHIFT,Slash,spawn,$HOME/.local/lib/mangowm/keybinds

# Event-driven multimedia controls.
bind=NONE,XF86AudioRaiseVolume,spawn,$HOME/.local/lib/mangowm/volume up
bind=NONE,XF86AudioLowerVolume,spawn,$HOME/.local/lib/mangowm/volume down
bind=NONE,XF86AudioMute,spawn,$HOME/.local/lib/mangowm/volume mute
bind=NONE,XF86AudioMicMute,spawn,$HOME/.local/lib/mangowm/volume mic-mute
bind=SUPER,V,spawn,$HOME/.local/lib/mangowm/volume menu
bind=NONE,XF86AudioPlay,spawn,$HOME/.local/lib/mangowm/media play-pause
bind=NONE,XF86AudioNext,spawn,$HOME/.local/lib/mangowm/media next
bind=NONE,XF86AudioPrev,spawn,$HOME/.local/lib/mangowm/media previous

# Screen recording (wf-recorder).
bind=SUPER,R,spawn,$HOME/.local/lib/mangowm/recording toggle
bind=SUPER+SHIFT,R,spawn,$HOME/.local/lib/mangowm/recording toggle-region
bind=SUPER+ALT,R,spawn,$HOME/.local/lib/mangowm/recording menu

# Display brightness controls (brightnessctl).
bind=NONE,XF86MonBrightnessUp,spawn,$HOME/.local/lib/mangowm/brightness up
bind=NONE,XF86MonBrightnessDown,spawn,$HOME/.local/lib/mangowm/brightness down

