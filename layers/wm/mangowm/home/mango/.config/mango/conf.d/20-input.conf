# Portable keyboard and pointer defaults. Device-specific input belongs in
# ../config.local.conf.
xkb_rules_layout=us,latam
xkb_rules_options=grp:alt_space_toggle
repeat_rate=25
repeat_delay=600
trackpad_natural_scrolling=0
mouse_natural_scrolling=0
tap_to_click=1
tap_and_drag=1
trackpad_disable_while_typing=1
