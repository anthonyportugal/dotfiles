# Portable MangoWM entrypoint. Keep machine-specific settings in
# config.local.conf; it is deliberately not versioned.
source=./conf.d/10-session.conf
source=./conf.d/20-input.conf
source=./conf.d/30-layout.conf
source=./conf.d/40-bindings.conf
source-optional=./conf.d/50-desktop.conf
source-optional=./conf.d/60-laptop.conf
source-optional=./conf.d/60-recording.conf
# The first path is the XDG default and covers display managers that do not
# export XDG_STATE_HOME. A custom state home, when present, wins afterwards.
source-optional=$HOME/.local/state/mangowm/theme/current/mango.conf
source-optional=$XDG_STATE_HOME/mangowm/theme/current/mango.conf
source-optional=./config.local.conf
