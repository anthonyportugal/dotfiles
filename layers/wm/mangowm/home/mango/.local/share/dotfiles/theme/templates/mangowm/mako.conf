# Generated by dotfiles-theme. Do not edit.
font=JetBrainsMono Nerd Font 10
background-color={{background}}f2
text-color={{foreground}}
border-color={{accent}}
progress-color=over {{surface_hover}}
border-size=2
border-radius=10
padding=12,14
margin=10
outer-margin=6,0
width=360
height=120
max-visible=5
max-history=20
default-timeout=5000
icons=1
max-icon-size=32
format=<b>%s</b>\n%b

# Repeated notifications of the same app and title collapse into one with a
# count, e.g. several messages from one chat.
group-by=app-name,summary

[grouped]
format=<b>%s</b> <span alpha="60%%">(%g)</span>\n%b

# Low urgency (toggles, saved captures): quieter border, shorter life.
[urgency=low]
border-color={{surface_hover}}
default-timeout=3000

[urgency=critical]
border-color={{urgent}}
default-timeout=0

# Volume and brightness overlay: compact, bottom centre, with the level as an
# accent bar. Each press replaces the previous one (mangowm_osd).
[category=osd]
anchor=bottom-center
width=240
height=60
margin=0,0,64
border-color={{surface_hover}}
progress-color=over {{accent}}
default-timeout=1500
group-by=none
format=<b>%s</b>

[category=osd-muted]
anchor=bottom-center
width=240
height=60
margin=0,0,64
border-color={{surface_hover}}
progress-color=over {{foreground_disabled}}40
default-timeout=1500
group-by=none
format=<b>%s</b>

# Do not disturb (bell right click or quick settings): hide everything except
# critical alerts such as a low battery, and the volume/brightness overlay you
# just asked for.
[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0

[mode=do-not-disturb category=osd]
invisible=0

[mode=do-not-disturb category=osd-muted]
invisible=0
