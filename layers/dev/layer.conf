# Opt-in development tools (--layer dev); no base profile includes it.
# profiles=dev only names the tier of its own manifests (packages/*/dev.txt).
# Heavier stacks are features: --feature dev-containers, dev-js, dev-go, dev-tauri, dev-herdr.
requires=cli
profiles=dev
features=dev-containers dev-js dev-go dev-tauri dev-herdr
prune_dirs=.config/zsh
description=Development tools: ShellCheck, shfmt, actionlint, GitHub CLI, jq, direnv, xh, hyperfine and oha
description.dev-containers=Containers: Docker, Docker Compose and lazydocker
description.dev-js=JavaScript: pnpm
description.dev-go=Go: go, golangci-lint and delve
description.dev-tauri=Tauri: rustup and the WebKitGTK system libraries
description.dev-herdr=herdr: terminal workspace to supervise coding agents (AUR herdr-bin)
