# Opt-in development tools (--layer dev); no base profile includes it.
# profiles=dev only names the tier of its own manifests (packages/*/dev.txt).
# Heavier stacks are features: --feature dev-containers, --feature dev-js.
requires=cli
profiles=dev
features=dev-containers dev-js
prune_dirs=.config/zsh
description=Development tools: ShellCheck, shfmt, actionlint, GitHub CLI and jq
description.dev-containers=Containers: Docker, Docker Compose and lazydocker
description.dev-js=JavaScript: pnpm
