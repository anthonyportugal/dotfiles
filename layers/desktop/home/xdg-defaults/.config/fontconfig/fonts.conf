<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Managed by dotfiles (desktop layer). Each generic family prefers its role
  font, then the Nerd Font symbols, a full text font and color emoji, so icons
  and emoji render even when the role font lacks them, and digits never fall
  back to the emoji font. Strong bindings outrank the locale, which would
  otherwise put DejaVu (monochrome emoji) first. Machine-specific rules belong
  in ~/.config/fontconfig/conf.d/.
-->
<fontconfig>
  <alias binding="same">
    <family>JetBrainsMono Nerd Font</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
