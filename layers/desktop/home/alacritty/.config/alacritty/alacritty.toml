# Shared terminal appearance for X11 and Wayland sessions. Font families and
# colors come from the active theme rendered by dotfiles-theme; alacritty
# skips a missing import, so it starts with its defaults until a theme exists.

[general]
import = ["~/.local/state/dotfiles/theme/current/alacritty/theme.toml"]

[window]
padding = { x = 26, y = 26 }
dynamic_padding = false
decorations = "None"
opacity = 1.0

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12.0

[font.normal]
style = "Medium"

[font.bold]
style = "Bold"

[font.italic]
style = "Light Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[colors]
draw_bold_text_with_bright_colors = false
