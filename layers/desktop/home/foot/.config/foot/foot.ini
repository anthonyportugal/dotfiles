# Foot terminal. Fonts and colors come from the active theme rendered by
# dotfiles-theme; until a theme exists foot reports the missing include and
# starts with its own defaults.
include=~/.local/state/dotfiles/theme/current/foot/theme.ini
pad=12x12 center

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000
multiplier=3.0

[mouse]
hide-when-typing=yes
