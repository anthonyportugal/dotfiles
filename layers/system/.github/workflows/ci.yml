name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  lint:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          shellcheck install.sh ly/setup.sh ly/startup.sh limine/setup.sh dns/setup.sh tests/test_suite.sh

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (luajit)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit

      - name: Run test suite
        run: |
          chmod +x tests/test_suite.sh install.sh ly/setup.sh ly/startup.sh limine/setup.sh dns/setup.sh
          ./tests/test_suite.sh
